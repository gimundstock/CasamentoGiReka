name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, so guest photos added to Drive get copied into the site
  # (06:00 in Brasília). Until then the site shows new ones from Drive.
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release check + Build
        run: npm run release
        env:
          VITE_APPSCRIPT_URL: ${{ secrets.VITE_APPSCRIPT_URL }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Copy guest photos from Drive
        run: node scripts/sync-guest-photos.mjs dist/guest-photos
        env:
          VITE_APPSCRIPT_URL: ${{ secrets.VITE_APPSCRIPT_URL }}
          PHOTO_SYNC_TOKEN: ${{ secrets.PHOTO_SYNC_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
