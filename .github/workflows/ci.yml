name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Typecheck, Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Read-only checks against the live Apps Script Web App. They depend on
      # Google's network, so a failure is reported but doesn't fail the build.
      - name: Live backend checks
        run: npm run test:e2e
        continue-on-error: true
        env:
          VITE_APPSCRIPT_URL: ${{ secrets.VITE_APPSCRIPT_URL }}
